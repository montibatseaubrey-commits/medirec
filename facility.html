<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medirec | Regional Dashboard</title>
    <style>
      :root { --bg:#edf4f2; --panel:#fff; --panel-alt:#f3f8f6; --border:#dfe9e4; --text:#12372f; --muted:#5d716d; --primary:#225f54; --primary-soft:#dfeee9; --accent:#d48c3d; --accent-soft:#f9f0df; --success:#2d7d55; --success-soft:#e4f7ea; --warning:#9d6c1a; --warning-soft:#f9efda; --danger:#b44539; --danger-soft:#fbe8e4; }
      * { box-sizing:border-box; }
      body { margin:0; font-family:Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
      a { text-decoration:none; color:inherit; }
      .topbar { display:flex; justify-content:space-between; align-items:center; background: var(--panel); border-bottom:1px solid var(--border); padding:18px 28px; }
      .brand { display:flex; gap:12px; align-items:center; }
      .brand-mark { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; color:white; font-weight:700; background: linear-gradient(135deg, var(--primary), #326c62); }
      .user { display:flex; align-items:center; gap:14px; }
      .badge { padding:6px 10px; border-radius:999px; font-size:0.72rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; }
      .role-badge { background: var(--primary-soft); color: var(--primary); }
      .logout { background:#f0f4f2; border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-weight:700; cursor:pointer; }
      .nav { display:flex; gap:10px; padding:18px 28px 0; flex-wrap:wrap; }
      .nav a { border:1px solid var(--border); border-radius:10px; background:var(--panel); padding:9px 14px; }
      .nav a.active { background:var(--primary-soft); color:var(--primary); }
      .page { padding:24px 28px 40px; }
      .hero { background:var(--panel); border:1px solid var(--border); border-radius:20px; box-shadow:0 14px 36px rgba(13,28,24,0.06); padding:22px 24px; margin-bottom:18px; }
      .hero h2 { margin:0 0 8px; }
      .hero p { margin:0; color:var(--muted); }
      .stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:16px; margin-bottom:18px; }
      .stat { background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:18px; }
      .stat-label { color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-size:0.75rem; }
      .stat-value { font-size:1.9rem; font-weight:700; margin:8px 0 5px; }
      .stat-note { color:var(--success); font-size:0.88rem; }
      .grid { display:grid; grid-template-columns: 1.4fr 1fr; gap:18px; margin-bottom:18px; }
      .panel { background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:18px; }
      .panel h3 { margin:0 0 12px; }
      table { width:100%; border-collapse: collapse; }
      th, td { border-bottom:1px solid var(--border); padding:10px 8px; text-align:left; }
      th { color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; font-size:0.76rem; }
      .status { display:inline-flex; padding:5px 9px; font-size:0.7rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; border-radius:999px; }
      .status-submitted { background:#edf3ff; color:#2a5d9c; }
      .status-allocated { background: var(--primary-soft); color: var(--primary); }
      .status-dispatched { background:#edf1ff; color:#335a9c; }
      .status-in-transit { background:var(--accent-soft); color:var(--warning); }
      .status-received { background:var(--success-soft); color:var(--success); }
      .status-reconciled { background:#eaf8ef; color:#2d7d56; }
      .status-low-stock { background:var(--warning-soft); color:var(--warning); }
      .status-urgent { background: var(--danger-soft); color: var(--danger); }
      .status-under-review { background:#f3ecff; color:#5d4c96; }
      .field-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; }
      .field { display:grid; gap:8px; }
      label { font-size:0.8rem; color:var(--muted); font-weight:700; }
      input, select, button { font:inherit; }
      input, select { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:#fbfdfc; }
      button.action { border:none; border-radius:10px; padding:10px 14px; background:var(--primary); color:white; font-weight:700; cursor:pointer; }
      .list { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
      .list li { display:flex; justify-content:space-between; gap:12px; padding:12px; border-radius:12px; border:1px solid var(--border); background: var(--panel-alt); }
      @media (max-width:860px){ .grid{grid-template-columns:1fr;} .topbar{flex-direction:column; align-items:flex-start; gap:12px;} }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div><strong>Medirec</strong></div>
      </div>
      <div class="user">
        <span class="badge role-badge">Regional</span>
        <span id="userName">Loading...</span>
        <button class="logout" onclick="logoutUser()">Logout</button>
      </div>
    </div>
    <nav class="nav">
      <a href="cms.html">CMS overview</a>
      <a class="active" href="regional.html">Regional view</a>
      <a href="facility.html">Facility view</a>
      <a href="pharmacy.html">Pharmacy view</a>
    </nav>
    <main class="page">
      <section class="hero">
        <h2>Southern Region Depot</h2>
        <p>Confirm incoming consignments, record received quantities and discrepancies, and coordinate regional medicine movements to health facilities.</p>
      </section>
      <section class="stats" id="stats"></section>
      <div class="grid">
        <section class="panel" id="ordersPanel"></section>
        <section class="panel" id="alertsPanel"></section>
      </div>
      <div class="grid">
        <section class="panel" id="receiptPanel"></section>
        <section class="panel" id="transferPanel"></section>
      </div>
      <div class="grid">
        <section class="panel" id="stockPanel"></section>
        <section class="panel" id="historyPanel"></section>
      </div>
    </main>

    <script>
      function requireSession() {
        const session = JSON.parse(localStorage.getItem('medirec-demo-session') || 'null');
        if (!session || session.role !== 'regional') {
          window.location.href = 'index.html';
          return null;
        }
        return session;
      }
      function logoutUser() { localStorage.removeItem('medirec-demo-session'); window.location.href='index.html'; }
      function defaultData() {
        return {
          orders: [
            { id:'ORD-1042', medicine:'Amoxicillin 250mg Capsule', quantityOrdered:300, quantityAllocated:0, quantityDispatched:0, quantityReceived:0, status:'Submitted', facility:'Gaborone District Hospital', updatedAt:'2026-10-15T08:15:00' },
            { id:'ORD-1050', medicine:'Oxytocin Injection', quantityOrdered:120, quantityAllocated:120, quantityDispatched:120, quantityReceived:48, status:'Received', facility:'Francistown Clinic', updatedAt:'2026-10-18T10:30:00' },
            { id:'ORD-1054', medicine:'Paracetamol 500mg', quantityOrdered:540, quantityAllocated:540, quantityDispatched:540, quantityReceived:0, status:'In Transit', facility:'Serowe Health Centre', updatedAt:'2026-10-22T16:45:00' },
            { id:'ORD-1061', medicine:'Insulin Glargine', quantityOrdered:94, quantityAllocated:0, quantityDispatched:0, quantityReceived:0, status:'Under Review', facility:'Maun General Hospital', updatedAt:'2026-10-18T11:00:00' }
          ],
          stock: {
            cms:[
              {medicine:'Amoxicillin 250mg Capsule', unit:'pack', quantity:780, location:'Central Warehouse', status:'Stable'},
              {medicine:'Paracetamol 500mg', unit:'tablet', quantity:4200, location:'Central Warehouse', status:'Ready'},
              {medicine:'Ceftriaxone Injection', unit:'vial', quantity:160, location:'Distribution Cold Room', status:'Low'}
            ],
            regional:[
              { medicine:'Amoxicillin 250mg Capsule', unit:'pack', quantity:320, location:'Southern Region Depot', status:'Stable' },
              { medicine:'Paracetamol 500mg', unit:'tablet', quantity:1800, location:'Southern Region Depot', status:'Ready' },
              { medicine:'Ceftriaxone Injection', unit:'vial', quantity:78, location:'Southern Region Depot', status:'Low' }
            ],
            facility:[],
            pharmacy:[]
          },
          movements: [
            {medicine:'Amoxicillin 250mg Capsule', quantity:300, unit:'pack', source:'Gaborone District Hospital', destination:'CMS', status:'Submitted', stakeholder:'Facility'},
            {medicine:'Oxytocin Injection', quantity:120, unit:'vial', source:'CMS', destination:'Francistown Clinic', status:'Dispatched', stakeholder:'CMS'},
            {medicine:'Oxytocin Injection', quantity:48, unit:'vial', source:'Southern Region Depot', destination:'Francistown Clinic', status:'Received', stakeholder:'Regional Depot'}
          ]
        };
      }
      function getData() { return JSON.parse(localStorage.getItem('medirec-demo-data') || 'null') || defaultData(); }
      function setData(data) { localStorage.setItem('medirec-demo-data', JSON.stringify(data)); }
      function renderStatus(status){ const key = (status||'').toLowerCase().replace(/\s+/g,'-'); return `<span class="status status-${key}">${status}</span>`; }
      function renderStats(data) {
        const incoming = data.orders.filter(o => ['Allocated','Dispatched','In Transit'].includes(o.status)).length;
        const received = data.orders.filter(o => ['Received','Reconciled'].includes(o.status)).length;
        const alerts = data.stock.regional.filter(item => item.status === 'Low').length;
        document.getElementById('stats').innerHTML = `
          <div class="stat"><div class="stat-label">Incoming consignments</div><div class="stat-value">${incoming}</div><div class="stat-note">Regional queue</div></div>
          <div class="stat"><div class="stat-label">Expected deliveries</div><div class="stat-value">${Math.max(incoming,2)}</div><div class="stat-note">This cycle</div></div>
          <div class="stat"><div class="stat-label">Received</div><div class="stat-value">${received}</div><div class="stat-note">Confirmed receipt</div></div>
          <div class="stat"><div class="stat-label">Alerts</div><div class="stat-value">${alerts}</div><div class="stat-note">Regional monitoring</div></div>
        `;
      }
      function renderOrders(data) {
        const rows = data.orders.map(order => `
          <tr><td>${order.id}</td><td>${order.medicine}</td><td>${order.quantityOrdered}</td><td>${order.facility}</td><td>${renderStatus(order.status)}</td><td>${new Date(order.updatedAt).toLocaleString()}</td><td><button class="action" data-review="${order.id}">Update</button></td></tr>
        `).join('');
        document.getElementById('ordersPanel').innerHTML = `
          <h3>Order and delivery queue</h3>
          <table><thead><tr><th>Order</th><th>Medicine</th><th>Qty</th><th>Facility</th><th>Status</th><th>Updated</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>
        `;
      }
      function renderAlerts() {
        const items = [
          { title:'Late handover', detail:'Regional transfer for Serowe is beyond expected date.', tag:'Urgent' },
          { title:'Low stock', detail:'Ceftriaxone supply is below threshold at depot store.', tag:'Low stock' },
          { title:'Receipt pending', detail:'Regional confirmation is awaiting facility reconciliation.', tag:'Review' }
        ];
        document.getElementById('alertsPanel').innerHTML = `
          <h3>Regional alerts</h3>
          <ul class="list">${items.map(item => `
            <li><div><strong>${item.title}</strong><div>${item.detail}</div></div><span class="status status-${item.tag === 'Urgent' ? 'urgent' : item.tag === 'Low stock' ? 'low-stock' : 'under-review'}">${item.tag}</span></li>
          `).join('')}</ul>
        `;
      }
      function renderReceiptPanel(data) {
        const options = data.orders.map(order => `<option value="${order.id}">${order.id} · ${order.medicine}</option>`).join('');
        document.getElementById('receiptPanel').innerHTML = `
          <h3>Receipt confirmation</h3>
          <form id="receiptForm">
            <div class="field-grid">
              <div class="field"><label>Order reference</label><select name="orderId">${options}</select></div>
              <div class="field"><label>Received quantity</label><input type="number" name="quantity" value="48" /></div>
              <div class="field"><label>Discrepancy</label><input type="number" name="discrepancy" value="12" /></div>
            </div>
            <div style="margin-top:14px;"><button class="action" type="submit">Record receipt</button></div>
          </form>
        `;
      }
      function renderTransferPanel() {
        document.getElementById('transferPanel').innerHTML = `
          <h3>Regional transfer overview</h3>
          <ul class="list">
            <li><div><strong>Serowe transfer</strong><div>Paracetamol 500mg moved to regional distribution queue.</div></div><span class="status status-allocated">Active</span></li>
            <li><div><strong>Facility handover</strong><div>Maun route delayed by 1.2 days; operations notified.</div></div><span class="status status-in-transit">Monitor</span></li>
          </ul>
        `;
      }
      function renderStock(data) {
        const rows = data.stock.regional.map(item => `<tr><td>${item.medicine}</td><td>${item.quantity} ${item.unit}</td><td>${item.location}</td><td><span class="status status-${item.status === 'Low' ? 'low-stock' : 'allocated'}">${item.status}</span></td></tr>`).join('');
        document.getElementById('stockPanel').innerHTML = `
          <h3>Regional stock overview</h3>
          <table><thead><tr><th>Medicine</th><th>Qty</th><th>Location</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>
        `;
      }
      function renderHistory(data) {
        const rows = data.movements.slice(0,5).map(item => `
          <li><div><strong>${item.medicine}</strong><div>${item.source} → ${item.destination}</div></div><div>${item.quantity} ${item.unit}<br>${renderStatus(item.status)}</div></li>
        `).join('');
        document.getElementById('historyPanel').innerHTML = `
          <h3>Movement history</h3>
          <ul class="list">${rows}</ul>
        `;
      }
      function initPage() {
        const session = requireSession();
        if (!session) return;
        document.getElementById('userName').textContent = `${session.name} · ${session.org}`;
        const data = getData();
        renderStats(data);
        renderOrders(data);
        renderAlerts();
        renderReceiptPanel(data);
        renderTransferPanel();
        renderStock(data);
        renderHistory(data);

        document.getElementById('receiptForm').addEventListener('submit', function (e) {
          e.preventDefault();
          const form = new FormData(e.target);
          const orderId = form.get('orderId');
          const quantity = Number(form.get('quantity'));
          const discrepancy = Number(form.get('discrepancy') || 0);
          const order = data.orders.find(item => item.id === orderId);
          if (!order) return;
          order.quantityReceived = quantity;
          order.status = discrepancy > 0 ? 'Received' : 'Reconciled';
          order.updatedAt = new Date().toISOString();
          data.movements.unshift({ medicine: order.medicine, quantity, unit: 'pack', source:'Regional Depot', destination: order.facility, status: order.status, stakeholder:'Regional Depot' });
          setData(data);
          alert('Regional receipt confirmed.');
          window.location.reload();
        });

        document.querySelectorAll('[data-review]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-review');
            const order = data.orders.find(item => item.id === id);
            alert(`${order.id} · ${order.medicine}\nStatus: ${order.status}\nFacility: ${order.facility}`);
          });
        });
      }
      initPage();
    </script>
  </body>
</html>
