<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medirec | CMS Dashboard</title>
    <style>
      :root {
        --bg: #edf4f2; --panel: #ffffff; --panel-alt: #f3f8f6; --border: #dde8e3; --text: #12362f; --muted: #5e716c;
        --primary: #1f5e52; --primary-soft: #dfeee9; --accent: #d18a3d; --accent-soft: #f7efe2; --warning: #9f6b18; --warning-soft: #f9efd7;
        --success: #2a7a4a; --success-soft: #e5f5e9; --danger: #b45042; --danger-soft: #fbe8e4; --shadow: 0 14px 36px rgba(13,28,24,0.06);
      }
      * { box-sizing: border-box; }
      body { margin:0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
      a { color: inherit; text-decoration: none; }
      .topbar { background: var(--panel); border-bottom: 1px solid var(--border); display:flex; justify-content:space-between; align-items:center; padding: 18px 28px; }
      .brand { display:flex; align-items:center; gap:12px; }
      .brand-mark { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background: linear-gradient(135deg, var(--primary), #346c62); color:white; font-weight:700; }
      .user { display:flex; align-items:center; gap:14px; }
      .badge { display:inline-flex; padding: 6px 10px; border-radius: 999px; font-size: 0.72rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; }
      .role-badge { background: var(--primary-soft); color: var(--primary); }
      .logout { background:#f0f2f1; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-weight:700; cursor:pointer; }
      .nav { display:flex; gap:10px; padding: 18px 28px 0; flex-wrap:wrap; }
      .nav a { padding:9px 14px; border-radius:10px; border:1px solid var(--border); background: var(--panel); color: var(--text); }
      .nav a.active { background: var(--primary-soft); color: var(--primary); }
      .page { padding: 24px 28px 40px; }
      .hero { background: var(--panel); border:1px solid var(--border); box-shadow: var(--shadow); border-radius:20px; padding:22px 24px; margin-bottom:18px; }
      .hero h2 { margin:0 0 8px; font-size: clamp(1.8rem,2vw,2.5rem); }
      .hero p { margin:0; color: var(--muted); }
      .stats { display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); margin-bottom:18px; }
      .stat { background: var(--panel); border:1px solid var(--border); border-radius:18px; box-shadow: var(--shadow); padding:18px 18px 16px; }
      .stat-label { color: var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-size:0.75rem; }
      .stat-value { font-size: 1.9rem; font-weight:700; margin:8px 0 4px; }
      .stat-note { color: var(--success); font-size:0.88rem; }
      .grid { display:grid; grid-template-columns: 1.4fr 1fr; gap:18px; margin-bottom:18px; }
      .panel { background: var(--panel); border:1px solid var(--border); border-radius:18px; padding:18px 18px 16px; box-shadow: var(--shadow); }
      .panel h3 { margin:0 0 12px; font-size:1.15rem; }
      table { width:100%; border-collapse: collapse; }
      th, td { border-bottom:1px solid var(--border); padding:10px 8px; text-align:left; }
      th { color: var(--muted); font-size:0.76rem; letter-spacing:0.06em; text-transform:uppercase; }
      .status { display:inline-flex; border-radius:999px; padding:5px 9px; font-size:0.7rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; }
      .status-submitted { background:#edf3ff; color:#2a5d9c; }
      .status-under-review { background:#f3ecff; color:#5d4c96; }
      .status-allocated { background:var(--primary-soft); color:var(--primary); }
      .status-dispatched { background:#edf1ff; color:#335a9c; }
      .status-in-transit { background:var(--accent-soft); color:var(--warning); }
      .status-received { background:var(--success-soft); color:var(--success); }
      .status-reconciled { background:#eaf8ef; color:#2d7d56; }
      .status-low-stock { background: var(--warning-soft); color: var(--warning); }
      .status-urgent { background: var(--danger-soft); color: var(--danger); }
      .field-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:14px; }
      .field { display:grid; gap:8px; }
      label { font-size:0.8rem; color:var(--muted); font-weight:700; }
      input, select, textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:#fbfdfc; color:var(--text); }
      textarea { min-height:88px; resize:vertical; }
      button.action { background: var(--primary); color:white; border:none; border-radius:10px; padding:9px 12px; font-weight:700; cursor:pointer; }
      .list { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
      .list li { border:1px solid var(--border); background: var(--panel-alt); border-radius:12px; padding:12px; display:flex; justify-content:space-between; gap:12px; }
      .empty { padding:18px; border:1px dashed var(--border); border-radius:12px; background:#fafdfb; color: var(--muted); }
      @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .topbar { flex-direction:column; align-items:flex-start; gap:12px; } }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div><strong>Medirec</strong></div>
      </div>
      <div class="user">
        <span class="badge role-badge">CMS</span>
        <span id="userName">Loading...</span>
        <button class="logout" onclick="logoutUser()">Logout</button>
      </div>
    </div>
    <nav class="nav">
      <a class="active" href="cms.html">CMS overview</a>
      <a href="regional.html">Regional view</a>
      <a href="facility.html">Facility view</a>
      <a href="pharmacy.html">Pharmacy view</a>
    </nav>
    <main class="page">
      <section class="hero">
        <h2>Central Medical Stores dashboard</h2>
        <p>Review orders, approve allocations, prepare dispatches, and monitor medicine flow across the national and regional systems.</p>
      </section>
      <section class="stats" id="stats"></section>
      <div class="grid">
        <section class="panel" id="ordersPanel"></section>
        <section class="panel" id="alertsPanel"></section>
      </div>
      <div class="grid">
        <section class="panel" id="allocationPanel"></section>
        <section class="panel" id="dispatchPanel"></section>
      </div>
      <div class="grid">
        <section class="panel" id="stockPanel"></section>
        <section class="panel" id="historyPanel"></section>
      </div>
    </main>

    <script>
      function getSession() {
        try { return JSON.parse(localStorage.getItem('medirec-demo-session')); } catch { return null; }
      }
      function requireSession() {
        const session = getSession();
        if (!session || session.role !== 'cms') {
          window.location.href = 'index.html';
          return null;
        }
        return session;
      }
      function logoutUser() {
        localStorage.removeItem('medirec-demo-session');
        window.location.href = 'index.html';
      }
      function getData() {
        try { return JSON.parse(localStorage.getItem('medirec-demo-data')); } catch { return null; }
      }
      function setData(data) { localStorage.setItem('medirec-demo-data', JSON.stringify(data)); }
      function defaultData() {
        return {
          orders: [
            { id: 'ORD-1042', medicine: 'Amoxicillin 250mg Capsule', quantityOrdered: 300, quantityAllocated: 0, quantityDispatched: 0, quantityReceived: 0, status: 'Submitted', facility: 'Gaborone District Hospital', updatedAt: '2026-10-15T08:15:00', notes: 'Pediatric ward restocking.' },
            { id: 'ORD-1050', medicine: 'Oxytocin Injection', quantityOrdered: 120, quantityAllocated: 120, quantityDispatched: 120, quantityReceived: 48, status: 'Received', facility: 'Francistown Clinic', updatedAt: '2026-10-18T10:30:00', notes: 'Emergency obstetric request.' },
            { id: 'ORD-1054', medicine: 'Paracetamol 500mg', quantityOrdered: 540, quantityAllocated: 540, quantityDispatched: 540, quantityReceived: 0, status: 'In Transit', facility: 'Serowe Health Centre', updatedAt: '2026-10-22T16:45:00', notes: 'Distribution in progress.' },
            { id: 'ORD-1061', medicine: 'Insulin Glargine', quantityOrdered: 94, quantityAllocated: 0, quantityDispatched: 0, quantityReceived: 0, status: 'Under Review', facility: 'Maun General Hospital', updatedAt: '2026-10-18T11:00:00', notes: 'Requires review due to stock planning.' },
            { id: 'ORD-1068', medicine: 'Ceftriaxone Injection', quantityOrdered: 200, quantityAllocated: 200, quantityDispatched: 200, quantityReceived: 120, status: 'Received', facility: 'Kasane Clinic', updatedAt: '2026-10-21T15:10:00', notes: 'High-priority infectious disease stock.' }
          ],
          stock: {
            cms: [
              { medicine: 'Amoxicillin 250mg Capsule', unit: 'pack', quantity: 780, location: 'Central Warehouse', status: 'Stable' },
              { medicine: 'Paracetamol 500mg', unit: 'tablet', quantity: 4200, location: 'Central Warehouse', status: 'Ready' },
              { medicine: 'Ceftriaxone Injection', unit: 'vial', quantity: 160, location: 'Distribution Cold Room', status: 'Low' },
              { medicine: 'Insulin Glargine', unit: 'pen', quantity: 240, location: 'Central Warehouse', status: 'Monitoring' },
              { medicine: 'Oxytocin Injection', unit: 'vial', quantity: 300, location: 'Central Warehouse', status: 'Ready' }
            ],
            regional: [
              { medicine: 'Amoxicillin 250mg Capsule', unit: 'pack', quantity: 320, location: 'Southern Region Depot', status: 'Stable' },
              { medicine: 'Paracetamol 500mg', unit: 'tablet', quantity: 1800, location: 'Southern Region Depot', status: 'Ready' },
              { medicine: 'Ceftriaxone Injection', unit: 'vial', quantity: 78, location: 'Southern Region Depot', status: 'Low' }
            ],
            facility: [
              { medicine: 'Amoxicillin 250mg Capsule', unit: 'pack', quantity: 92, location: 'Ward Store', status: 'Low' },
              { medicine: 'Paracetamol 500mg', unit: 'tablet', quantity: 640, location: 'Pharmacy', status: 'Ready' },
              { medicine: 'Ceftriaxone Injection', unit: 'vial', quantity: 36, location: 'Emergency Unit', status: 'Low' }
            ],
            pharmacy: [
              { medicine: 'Amoxicillin 250mg Capsule', unit: 'pack', quantity: 88, location: 'Pharmacy Shelf', status: 'Low' },
              { medicine: 'Paracetamol 500mg', unit: 'tablet', quantity: 540, location: 'Dispensing Shelf', status: 'Ready' },
              { medicine: 'Ceftriaxone Injection', unit: 'vial', quantity: 18, location: 'Pharmacy Store', status: 'Low' }
            ]
          },
          movements: [
            { id: 'MVT-001', medicine: 'Amoxicillin 250mg Capsule', quantity: 300, unit: 'pack', source: 'Gaborone District Hospital', destination: 'CMS', status: 'Submitted', stakeholder: 'Facility', notes: 'Request submitted for ward restocking.' },
            { id: 'MVT-002', medicine: 'Oxytocin Injection', quantity: 120, unit: 'vial', source: 'CMS', destination: 'Francistown Clinic', status: 'Dispatched', stakeholder: 'CMS', notes: 'Dispatch prepared and confirmed.' },
            { id: 'MVT-003', medicine: 'Oxytocin Injection', quantity: 48, unit: 'vial', source: 'Southern Region Depot', destination: 'Francistown Clinic', status: 'Received', stakeholder: 'Regional Depot', notes: 'Partial receipt record due to discrepancy.' },
            { id: 'MVT-004', medicine: 'Paracetamol 500mg', quantity: 540, unit: 'tablet', source: 'CMS', destination: 'Serowe Health Centre', status: 'In Transit', stakeholder: 'CMS', notes: 'Vehicle dispatch in progress.' }
          ]
        };
      }
      function renderStatus(status) {
        const friendly = (status || '').toLowerCase().replace(/\s+/g, '-');
        return `<span class="status status-${friendly}">${status}</span>`;
      }
      function renderStats(data) {
        const orders = data.orders;
        const pending = orders.filter(o => ['Submitted','Under Review','Allocated','Dispatched','In Transit'].includes(o.status)).length;
        const low = data.stock.cms.filter(item => item.status === 'Low').length;
        const dispatches = orders.filter(o => ['Dispatched','In Transit'].includes(o.status)).length;
        const stockLines = data.stock.cms.length;
        document.getElementById('stats').innerHTML = [
          `<div class="stat"><div class="stat-label">Stock lines</div><div class="stat-value">${stockLines}</div><div class="stat-note">Central visibility</div></div>`,
          `<div class="stat"><div class="stat-label">Pending review</div><div class="stat-value">${pending}</div><div class="stat-note">Awaiting allocation</div></div>`,
          `<div class="stat"><div class="stat-label">In transit</div><div class="stat-value">${dispatches}</div><div class="stat-note">Active consignments</div></div>`,
          `<div class="stat"><div class="stat-label">Low-stock alerts</div><div class="stat-value">${low}</div><div class="stat-note">Requires action</div></div>`
        ].join('');
      }
      function renderOrders(data) {
        const rows = data.orders.map(order => `
          <tr>
            <td>${order.id}</td>
            <td>${order.medicine}</td>
            <td>${order.quantityOrdered}</td>
            <td>${order.facility}</td>
            <td>${renderStatus(order.status)}</td>
            <td>${new Date(order.updatedAt).toLocaleString()}</td>
            <td><button class="action" data-action="review" data-order="${order.id}">Review</button></td>
          </tr>
        `).join('');
        document.getElementById('ordersPanel').innerHTML = `
          <h3>Order queue</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Order</th><th>Medicine</th><th>Qty</th><th>Facility</th><th>Status</th><th>Updated</th><th>Action</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }
      function renderAlerts() {
        const alerts = [
          { title: 'Delayed dispatch', detail: 'ORD-1054 remains in transit beyond the expected handover window.', tag: 'Urgent' },
          { title: 'Stock risk', detail: 'Ceftriaxone stock is below the recommended threshold at central stores.', tag: 'Low stock' },
          { title: 'Receipt follow-up', detail: 'Pending facility reconciliation for the previous dispatch cycle.', tag: 'Review' }
        ];
        document.getElementById('alertsPanel').innerHTML = `
          <h3>Alerts and follow-up</h3>
          <ul class="list">${alerts.map(item => `
            <li><div><strong>${item.title}</strong><div>${item.detail}</div></div><span class="status status-${item.tag === 'Urgent' ? 'urgent' : item.tag === 'Low stock' ? 'low-stock' : 'under-review'}">${item.tag}</span></li>
          `).join('')}</ul>
        `;
      }
      function renderAllocationPanel(data) {
        const orderOptions = data.orders.map(order => `<option value="${order.id}">${order.id} · ${order.medicine}</option>`).join('');
        document.getElementById('allocationPanel').innerHTML = `
          <h3>Allocation review</h3>
          <form id="allocateForm">
            <div class="field-grid">
              <div class="field"><label>Order reference</label><select name="orderId">${orderOptions}</select></div>
              <div class="field"><label>Allocated quantity</label><input type="number" name="quantity" value="120" /></div>
            </div>
            <div style="margin-top: 14px;"><button class="action" type="submit">Allocate stock</button></div>
          </form>
        `;
      }
      function renderDispatchPanel(data) {
        const orderOptions = data.orders.map(order => `<option value="${order.id}">${order.id} · ${order.medicine}</option>`).join('');
        document.getElementById('dispatchPanel').innerHTML = `
          <h3>Dispatch preparation</h3>
          <form id="dispatchForm">
            <div class="field-grid">
              <div class="field"><label>Order reference</label><select name="orderId">${orderOptions}</select></div>
              <div class="field"><label>Destination</label><input name="destination" value="Gaborone District Hospital" /></div>
              <div class="field"><label>Dispatch reference</label><input name="reference" value="DSP-2091" /></div>
            </div>
            <div style="margin-top: 14px;"><button class="action" type="submit">Prepare & confirm dispatch</button></div>
          </form>
        `;
      }
      function renderStock(data) {
        const rows = data.stock.cms.map(item => `
          <tr><td>${item.medicine}</td><td>${item.quantity} ${item.unit}</td><td>${item.location}</td><td><span class="status status-${item.status.toLowerCase().includes('low') ? 'low-stock' : item.status.toLowerCase().includes('monitor') ? 'under-review' : 'allocated'}">${item.status}</span></td></tr>
        `).join('');
        document.getElementById('stockPanel').innerHTML = `
          <h3>Central stock overview</h3>
          <table><thead><tr><th>Medicine</th><th>Qty</th><th>Location</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>
        `;
      }
      function renderHistory(data) {
        const rows = data.movements.slice(0,5).map(item => `
          <li><div><strong>${item.medicine}</strong><div>${item.source} → ${item.destination}</div></div><div>${item.quantity} ${item.unit}<br>${renderStatus(item.status)}</div></li>
        `).join('');
        document.getElementById('historyPanel').innerHTML = `
          <h3>Movement history</h3>
          <ul class="list">${rows}</ul>
        `;
      }
      function initPage() {
        const session = requireSession();
        if (!session) return;
        document.getElementById('userName').textContent = `${session.name} · ${session.org}`;

        let data = getData();
        if (!data) {
          data = defaultData();
          setData(data);
        }

        renderStats(data);
        renderOrders(data);
        renderAlerts();
        renderAllocationPanel(data);
        renderDispatchPanel(data);
        renderStock(data);
        renderHistory(data);

        document.getElementById('allocateForm').addEventListener('submit', function (e) {
          e.preventDefault();
          const form = new FormData(e.target);
          const orderId = form.get('orderId');
          const quantity = Number(form.get('quantity'));
          const order = data.orders.find(item => item.id === orderId);
          if (!order || quantity <= 0 || quantity > order.quantityOrdered) {
            alert('Allocation must be greater than zero and cannot exceed the order quantity.');
            return;
          }
          order.quantityAllocated = quantity;
          order.status = 'Allocated';
          order.updatedAt = new Date().toISOString();
          data.movements.unshift({ id: 'MVT-' + Date.now(), medicine: order.medicine, quantity, unit: 'pack', source: 'CMS', destination: order.facility, status: 'Allocated', stakeholder: 'CMS', notes: 'Manual allocation approved by central team.' });
          setData(data);
          alert('Allocation recorded successfully.');
          window.location.reload();
        });

        document.getElementById('dispatchForm').addEventListener('submit', function (e) {
          e.preventDefault();
          const form = new FormData(e.target);
          const orderId = form.get('orderId');
          const destination = form.get('destination');
          const reference = form.get('reference');
          const order = data.orders.find(item => item.id === orderId);
          if (!order) return;
          order.quantityDispatched = order.quantityAllocated || order.quantityOrdered;
          order.status = 'In Transit';
          order.updatedAt = new Date().toISOString();
          data.movements.unshift({ id: 'MVT-' + Date.now(), medicine: order.medicine, quantity: order.quantityDispatched, unit: 'pack', source: 'CMS', destination, status: 'In Transit', stakeholder: 'CMS', notes: 'Dispatch confirmed with reference ' + reference + '.' });
          setData(data);
          alert('Dispatch prepared and confirmed.');
          window.location.reload();
        });

        document.querySelectorAll('[data-action="review"]').forEach(button => {
          button.addEventListener('click', () => {
            const id = button.getAttribute('data-order');
            const order = data.orders.find(item => item.id === id);
            if (!order) return;
            alert(`${order.id} · ${order.medicine}\nStatus: ${order.status}\nFacility: ${order.facility}\nNotes: ${order.notes || 'No notes'}`);
          });
        });
      }
      initPage();
    </script>
  </body>
</html>
